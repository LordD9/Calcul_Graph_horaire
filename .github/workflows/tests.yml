name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Lint Chronofer
        run: python outils/lint_chronofer.py
      - name: Run the complete suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Télécharger TLA+ 1.8.0
        run: |
          curl -sSL -o formel/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713  formel/tla2tools.jar" | sha256sum -c
      - name: Modèle EtatSession (passe) et bugs rejoués (échouent)
        run: formel/verifier.sh
